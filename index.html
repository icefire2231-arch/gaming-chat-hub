<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat - Gaming Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#8b5cf6', 600: '#7c3aed' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden font-sans">

    <!-- Écran d'authentification -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center relative">
            <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-violet-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center text-2xl shadow-lg border-4 border-slate-950">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <h1 class="text-2xl font-bold mt-4 mb-2">NexusChat</h1>
            <p class="text-slate-400 text-sm mb-6">Rejoins les salons de discussion gaming en temps réel, discute Brawl Stars, Clash of Clans, Clash Royale & Roblox avec la communauté.</p>
            
            <div class="space-y-3">
                <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-medium py-3 px-4 rounded-xl transition flex items-center justify-center gap-3 shadow-md">
                    <i class="fa-brands fa-google text-red-500"></i> Continuer avec Google
                </button>
                <button onclick="loginAnonymously()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 px-4 rounded-xl transition flex items-center justify-center gap-3 border border-slate-700">
                    <i class="fa-solid fa-user-secret"></i> Mode Invité Rapide
                </button>
            </div>
        </div>
    </div>

    <!-- Application principale de Chat -->
    <div id="app-screen" class="flex h-full w-full hidden">
        <!-- Sidebar des salons -->
        <div class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <span class="font-bold text-lg flex items-center gap-2"><i class="fa-solid fa-gamepad text-violet-500"></i> NexusChat</span>
                <button onclick="logout()" title="Se déconnecter" class="text-slate-400 hover:text-red-400 transition"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
            <div class="p-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Salons de jeux</div>
            <div id="channels-list" class="flex-1 overflow-y-auto px-2 space-y-1">
                <!-- Salons injectés dynamiquement -->
            </div>
            <div class="p-3 border-t border-slate-800 flex items-center justify-between bg-slate-950/50">
                <div class="flex items-center gap-2 truncate">
                    <div class="w-8 h-8 rounded-full bg-violet-600 flex items-center justify-center text-sm font-bold" id="user-avatar">U</div>
                    <span class="text-sm font-medium truncate" id="user-name">Utilisateur</span>
                </div>
            </div>
        </div>

        <!-- Zone de discussion -->
        <div class="flex-1 flex flex-col bg-slate-950">
            <div class="h-16 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/50 backdrop-blur">
                <h2 id="current-channel-title" class="font-bold text-lg"># général</h2>
            </div>
            <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Messages injectés dynamiquement -->
            </div>
            <div class="p-4 border-t border-slate-800 bg-slate-900/50">
                <form id="message-form" onsubmit="sendMessage(event)" class="flex gap-2">
                    <input type="text" id="message-input" placeholder="Envoyer un message..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500 text-slate-100">
                    <button type="submit" class="bg-violet-600 hover:bg-violet-500 text-white px-5 rounded-xl transition font-medium text-sm flex items-center justify-center shadow-lg"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>
        </div>
    </div>

    <!-- Notifications Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 border border-slate-700 text-slate-200 px-4 py-3 rounded-xl shadow-2xl hidden z-50 text-sm flex items-center gap-3">
        <i class="fa-solid fa-circle-info text-violet-500"></i>
        <span id="toast-message">Message</span>
    </div>

    <!-- Scripts Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Votre configuration Firebase exacte
        const firebaseConfig = {
            apiKey: "AIzaSyB9P5Y1ywmsbQt_PMCNsiRkryppVI1421o",
            authDomain: "gaming-chat-hub.firebaseapp.com",
            projectId: "gaming-chat-hub",
            storageBucket: "gaming-chat-hub.firebasestorage.app",
            messagingSenderId: "838358986335",
            appId: "1:838358986335:web:1294305385b47d9bb275ea",
            measurementId: "G-VVKQ8TH92L"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentChannel = "général";
        let unsubscribeMessages = null;

        const channels = [
            { id: "général", name: "Général", icon: "fa-comments" },
            { id: "brawl-stars", name: "Brawl Stars", icon: "fa-star" },
            { id: "clash-of-clans", name: "Clash of Clans", icon: "fa-shield-halved" },
            { id: "clash-royale", name: "Clash Royale", icon: "fa-crown" },
            { id: "roblox", name: "Roblox", icon: "fa-cube" }
        ];

        function initChannels() {
            const list = document.getElementById('channels-list');
            list.innerHTML = channels.map(c => `
                <button onclick="switchChannel('${c.id}')" class="w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium flex items-center gap-3 transition ${currentChannel === c.id ? 'bg-violet-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}">
                    <i class="fa-solid ${c.icon} w-5"></i> ${c.name}
                </button>
            `).join('');
        }

        window.switchChannel = function(channelId) {
            currentChannel = channelId;
            const chan = channels.find(c => c.id === channelId);
            document.getElementById('current-channel-title').textContent = `# ${chan ? chan.name : channelId}`;
            initChannels();
            loadMessages();
        }

        window.loginAnonymously = async () => {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                showToast("Erreur de connexion anonyme: " + error.message);
            }
        };

        window.loginWithGoogle = async () => {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
            } catch (error) {
                showToast("Erreur de connexion Google: " + error.message);
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                
                const name = user.displayName || (user.isAnonymous ? "Invité_" + user.uid.slice(0,4) : "Utilisateur");
                document.getElementById('user-name').textContent = name;
                document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();
                
                initChannels();
                loadMessages();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
                if (unsubscribeMessages) unsubscribeMessages();
            }
        });

        window.sendMessage = async (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            try {
                await addDoc(collection(db, "channels", currentChannel, "messages"), {
                    text: text,
                    uid: currentUser.uid,
                    displayName: currentUser.displayName || (currentUser.isAnonymous ? "Invité_" + currentUser.uid.slice(0,4) : "Utilisateur"),
                    createdAt: serverTimestamp()
                });
                input.value = '';
            } catch (error) {
                showToast("Erreur d'envoi: " + error.message);
            }
        };

        function loadMessages() {
            if (unsubscribeMessages) unsubscribeMessages();
            const q = query(collection(db, "channels", currentChannel, "messages"), orderBy("createdAt", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('messages-container');
                container.innerHTML = snapshot.docs.map(doc => {
                    const msg = doc.data();
                    const isMe = currentUser && msg.uid === currentUser.uid;
                    return `
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                            <div class="max-w-[70%]">
                                <div class="text-xs text-slate-500 mb-1 px-1">${msg.displayName || 'Anonyme'}</div>
                                <div class="p-3.5 rounded-2xl text-sm ${isMe ? 'bg-violet-600 text-white rounded-br-none shadow-md' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none'}">
                                    ${escapeHtml(msg.text)}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                container.scrollTop = container.scrollHeight;
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 4000);
        }
    </script>
</body>
</html>
