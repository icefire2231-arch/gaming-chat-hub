<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat - Gaming Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#8b5cf6', 600: '#7c3aed' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden font-sans">

    <!-- Écran d'authentification -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center relative">
            <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-violet-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center text-2xl shadow-lg border-4 border-slate-950">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <h1 class="text-2xl font-bold mt-4 mb-2">NexusChat</h1>
            <p class="text-slate-400 text-sm mb-6">Rejoins les salons de discussion gaming en temps réel, discute Brawl Stars, Clash of Clans, Clash Royale & Roblox avec la communauté.</p>
            
            <div class="space-y-3">
                <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-medium py-3 px-4 rounded-xl transition flex items-center justify-center gap-3 shadow-md">
                    <i class="fa-brands fa-google text-red-500"></i> Continuer avec Google
                </button>
                <button onclick="loginAnonymously()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 px-4 rounded-xl transition flex items-center justify-center gap-3 border border-slate-700">
                    <i class="fa-solid fa-user-secret"></i> Mode Invité Rapide
                </button>
            </div>
        </div>
    </div>

    <!-- Application principale de Chat -->
    <div id="app-screen" class="flex h-full w-full hidden relative">
        <!-- Overlay mobile pour fermer la sidebar -->
        <div id="sidebar-overlay" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-black/50 z-20 md:hidden hidden"></div>

        <!-- Sidebar des salons -->
        <div id="sidebar" class="absolute md:relative inset-y-0 left-0 w-72 bg-slate-900 border-r border-slate-800 flex flex-col z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-200">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <span class="font-bold text-lg flex items-center gap-2"><i class="fa-solid fa-gamepad text-violet-500"></i> NexusChat</span>
                <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Salons de jeux</div>
            <div id="channels-list" class="flex-1 overflow-y-auto px-2 space-y-1"></div>
            
            <!-- Profil utilisateur & Paramètres -->
            <div class="p-3 border-t border-slate-800 flex items-center justify-between bg-slate-950/50">
                <div class="flex items-center gap-2 truncate cursor-pointer" onclick="openProfileModal()" title="Modifier mon profil">
                    <div id="user-avatar-container" class="w-9 h-9 rounded-full bg-violet-600 flex items-center justify-center text-sm font-bold overflow-hidden border border-violet-500">
                        <span id="user-avatar-text">U</span>
                    </div>
                    <div class="truncate">
                        <span class="text-sm font-medium truncate block" id="user-name">Utilisateur</span>
                        <span class="text-xs text-violet-400">Modifier profil</span>
                    </div>
                </div>
                <button onclick="openProfileModal()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-gear"></i></button>
            </div>
        </div>

        <!-- Zone de discussion -->
        <div class="flex-1 flex flex-col bg-slate-950 w-full">
            <div class="h-16 border-b border-slate-800 px-4 md:px-6 flex items-center justify-between bg-slate-900/50 backdrop-blur">
                <div class="flex items-center gap-3">
                    <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-300 hover:text-white text-lg"><i class="fa-solid fa-bars"></i></button>
                    <h2 id="current-channel-title" class="font-bold text-lg"># général</h2>
                </div>
                <!-- Indicateur des connectés -->
                <div class="flex items-center gap-2 bg-slate-800/60 px-3 py-1.5 rounded-full border border-slate-700/50 text-xs">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="online-count" class="text-slate-300 font-medium">0 en ligne</span>
                </div>
            </div>

            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4"></div>

            <!-- Input & Suggestions de Mentions (@) -->
            <div class="p-4 border-t border-slate-800 bg-slate-900/50 relative">
                <div id="mention-suggestions" class="absolute bottom-20 left-4 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-h-40 overflow-y-auto w-64 hidden z-40"></div>
                
                <form id="message-form" onsubmit="sendMessage(event)" class="flex gap-2">
                    <input type="text" id="message-input" placeholder="Envoyer un message (tapez @ pour mentionner)..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500 text-slate-100">
                    <button type="submit" class="bg-violet-600 hover:bg-violet-500 text-white px-5 rounded-xl transition font-medium text-sm flex items-center justify-center shadow-lg"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modale de profil -->
    <div id="profile-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
            <h3 class="font-bold text-lg text-slate-100">Modifier mon profil</h3>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Votre pseudo personnalisé</label>
                <input type="text" id="edit-username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-violet-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">URL de votre avatar (Lien d'image)</label>
                <input type="text" id="edit-avatar" placeholder="https://exemple.com/image.png" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-violet-500">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeProfileModal()" class="px-4 py-2 rounded-xl text-sm bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Annuler</button>
                <button onclick="saveProfile()" class="px-4 py-2 rounded-xl text-sm bg-violet-600 hover:bg-violet-500 text-white transition font-medium">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modale d'inspection de profil au clic sur un pseudo -->
    <div id="user-card-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-xs w-full text-center space-y-3 shadow-2xl relative">
            <button onclick="closeUserCard()" class="absolute top-3 right-3 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <div id="card-avatar" class="w-20 h-20 rounded-full mx-auto bg-violet-600 flex items-center justify-center text-2xl font-bold overflow-hidden border-2 border-violet-500"></div>
            <h3 id="card-username" class="font-bold text-lg text-slate-100">Nom</h3>
            <span class="inline-block px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs rounded-full">En ligne</span>
        </div>
    </div>

    <!-- Notifications Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 border border-violet-500/50 text-slate-200 px-4 py-3 rounded-xl shadow-2xl hidden z-50 text-sm flex items-center gap-3">
        <i class="fa-solid fa-bell text-violet-500 animate-bounce"></i>
        <span id="toast-message">Message</span>
    </div>

    <!-- Scripts Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9P5Y1ywmsbQt_PMCNsiRkryppVI1421o",
            authDomain: "gaming-chat-hub.firebaseapp.com",
            projectId: "gaming-chat-hub",
            storageBucket: "gaming-chat-hub.firebasestorage.app",
            messagingSenderId: "838358986335",
            appId: "1:838358986335:web:1294305385b47d9bb275ea",
            measurementId: "G-VVKQ8TH92L"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentChannel = "général";
        let unsubscribeMessages = null;
        let userProfile = { name: "", avatar: "" };
        let allUsersList = [];

        // Salons équipés d'icônes propres et stylées
        const channels = [
            { id: "général", name: "Général", icon: "fa-fire text-orange-500" }, 
            { id: "brawl-stars", name: "Brawl Stars", icon: "fa-skull text-yellow-400" },
            { id: "clash-of-clans", name: "Clash of Clans", icon: "fa-shield-halved text-amber-500" },
            { id: "clash-royale", name: "Clash Royale", icon: "fa-crown text-blue-400" },
            { id: "roblox", name: "Roblox", icon: "fa-cube text-red-400" }
        ];

        window.toggleMobileSidebar = () => {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        };

        function initChannels() {
            const list = document.getElementById('channels-list');
            list.innerHTML = channels.map(c => `
                <button onclick="switchChannel('${c.id}')" class="w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium flex items-center gap-3 transition ${currentChannel === c.id ? 'bg-violet-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}">
                    <i class="fa-solid ${c.icon} w-5 text-center text-base"></i> 
                    <span class="truncate">${c.name}</span>
                </button>
            `).join('');
        }

        window.switchChannel = function(channelId) {
            currentChannel = channelId;
            const chan = channels.find(c => c.id === channelId);
            document.getElementById('current-channel-title').textContent = `# ${chan ? chan.name : channelId}`;
            initChannels();
            loadMessages();
            if(window.innerWidth < 768) toggleMobileSidebar();
        }

        window.loginAnonymously = async () => {
            try { await signInAnonymously(auth); } catch (error) { showToast("Erreur: " + error.message); }
        };

        window.loginWithGoogle = async () => {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
            } catch (error) { showToast("Erreur: " + error.message); }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists()) {
                    userProfile = userSnap.data();
                } else {
                    userProfile = {
                        name: user.displayName || (user.isAnonymous ? "Invité_" + user.uid.slice(0,4) : "Utilisateur"),
                        avatar: user.photoURL || ""
                    };
                    await setDoc(userRef, userProfile);
                }
                
                updateUIRating();
                fetchUsersList();
                initChannels();
                loadMessages();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
                if (unsubscribeMessages) unsubscribeMessages();
            }
        });

        async function fetchUsersList() {
            const querySnapshot = await getDocs(collection(db, "users"));
            allUsersList = [];
            querySnapshot.forEach((doc) => {
                allUsersList.push(doc.data());
            });
            document.getElementById('online-count').textContent = `${allUsersList.length} en ligne`;
        }

        function updateUIRating() {
            document.getElementById('user-name').textContent = userProfile.name;
            const container = document.getElementById('user-avatar-container');
            if (userProfile.avatar) {
                container.innerHTML = `<img src="${userProfile.avatar}" class="w-full h-full object-cover">`;
            } else {
                container.innerHTML = `<span id="user-avatar-text">${userProfile.name.charAt(0).toUpperCase()}</span>`;
            }
        }

        window.openProfileModal = () => {
            document.getElementById('edit-username').value = userProfile.name;
            document.getElementById('edit-avatar').value = userProfile.avatar;
            document.getElementById('profile-modal').classList.remove('hidden');
        }

        window.closeProfileModal = () => {
            document.getElementById('profile-modal').classList.add('hidden');
        }

        window.saveProfile = async () => {
            const newName = document.getElementById('edit-username').value.trim();
            const newAvatar = document.getElementById('edit-avatar').value.trim();
            if (!newName) return showToast("Le pseudo ne peut pas être vide.");

            userProfile.name = newName;
            userProfile.avatar = newAvatar;

            await setDoc(doc(db, "users", currentUser.uid), userProfile);
            updateUIRating();
            fetchUsersList();
            closeProfileModal();
            showToast("Profil mis à jour avec succès !");
        }

        window.inspectUser = (name, avatar) => {
            document.getElementById('card-username').textContent = name;
            const cardAvatar = document.getElementById('card-avatar');
            if (avatar) {
                cardAvatar.innerHTML = `<img src="${avatar}" class="w-full h-full object-cover">`;
            } else {
                cardAvatar.innerHTML = `<span>${name.charAt(0).toUpperCase()}</span>`;
            }
            document.getElementById('user-card-modal').classList.remove('hidden');
        }

        window.closeUserCard = () => {
            document.getElementById('user-card-modal').classList.add('hidden');
        }

        const msgInput = document.getElementById('message-input');
        msgInput.addEventListener('input', (e) => {
            const val = msgInput.value;
            const cursorPos = msgInput.selectionStart;
            const textBeforeCursor = val.slice(0, cursorPos);
            const match = textBeforeCursor.match(/@(\w*)$/);

            const suggestionsBox = document.getElementById('mention-suggestions');
            if (match) {
                const queryStr = match[1].toLowerCase();
                const filtered = allUsersList.filter(u => u.name.toLowerCase().startsWith(queryStr));
                
                if (filtered.length > 0) {
                    suggestionsBox.innerHTML = filtered.map(u => `
                        <div onclick="selectMention('${u.name}')" class="px-3 py-2 hover:bg-slate-800 text-xs text-slate-200 cursor-pointer flex items-center gap-2">
                            <div class="w-5 h-5 rounded-full bg-violet-600 flex items-center justify-center overflow-hidden font-bold text-[10px]">
                                ${u.avatar ? `<img src="${u.avatar}" class="w-full h-full object-cover">` : u.name.charAt(0)}
                            </div>
                            <span>${u.name}</span>
                        </div>
                    `).join('');
                    suggestionsBox.classList.remove('hidden');
                } else {
                    suggestionsBox.classList.add('hidden');
                }
            } else {
                suggestionsBox.classList.add('hidden');
            }
        });

        window.selectMention = (name) => {
            const msgInput = document.getElementById('message-input');
            const val = msgInput.value;
            const cursorPos = msgInput.selectionStart;
            const textBeforeCursor = val.slice(0, cursorPos);
            const textAfterCursor = val.slice(cursorPos);
            
            const updatedBefore = textBeforeCursor.replace(/@\w*$/, `@${name} `);
            msgInput.value = updatedBefore + textAfterCursor;
            document.getElementById('mention-suggestions').classList.add('hidden');
            msgInput.focus();
        };

        window.sendMessage = async (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            try {
                await addDoc(collection(db, "channels", currentChannel, "messages"), {
                    text: text,
                    uid: currentUser.uid,
                    displayName: userProfile.name,
                    avatar: userProfile.avatar,
                    createdAt: serverTimestamp()
                });
                input.value = '';
                document.getElementById('mention-suggestions').classList.add('hidden');
            } catch (error) {
                showToast("Erreur d'envoi: " + error.message);
            }
        };

        function loadMessages() {
            if (unsubscribeMessages) unsubscribeMessages();
            const q = query(collection(db, "channels", currentChannel, "messages"), orderBy("createdAt", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('messages-container');
                container.innerHTML = snapshot.docs.map(doc => {
                    const msg = doc.data();
                    const isMe = currentUser && msg.uid === currentUser.uid;
                    
                    if (currentUser && !isMe && msg.text.includes(`@${userProfile.name}`)) {
                        showToast(`🔔 Vous avez été mentionné par ${msg.displayName} !`);
                    }

                    const avatarHtml = msg.avatar 
                        ? `<img src="${msg.avatar}" class="w-8 h-8 rounded-full object-cover">`
                        : `<div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-xs font-bold">${(msg.displayName || 'A').charAt(0).toUpperCase()}</div>`;

                    return `
                        <div class="flex gap-3 ${isMe ? 'flex-row-reverse' : 'flex-row'} items-end">
                            <div class="cursor-pointer" onclick="inspectUser('${escapeHtml(msg.displayName || 'Anonyme')}', '${msg.avatar || ''}')">${avatarHtml}</div>
                            <div class="max-w-[70%]">
                                <div class="text-xs text-slate-500 mb-1 px-1 ${isMe ? 'text-right' : 'text-left'} cursor-pointer hover:underline" onclick="inspectUser('${escapeHtml(msg.displayName || 'Anonyme')}', '${msg.avatar || ''}')">${escapeHtml(msg.displayName || 'Anonyme')}</div>
                                <div class="p-3.5 rounded-2xl text-sm ${isMe ? 'bg-violet-600 text-white rounded-br-none shadow-md' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none'}">
                                    ${escapeHtml(msg.text)}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                container.scrollTop = container.scrollHeight;
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.showToast = function(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 4000);
        }
    </script>
</body>
</html>
